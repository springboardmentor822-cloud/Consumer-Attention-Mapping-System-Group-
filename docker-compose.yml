version: '3.8'

services:
  backend:
    build: .
    ports:
      - "9000:9000"
    volumes:
      - ./cams_retail.db:/app/cams_retail.db
    restart: always

  # Optional: If you want to containerize the Next.js frontend as well
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:9000
    depends_on:
      - backend
    restart: always