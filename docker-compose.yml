version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: retail_postgres
    restart: always
    environment:
      POSTGRES_DB: retail_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retail_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retail_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/retail_intelligence
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: super-secret-key-ai-retail-intelligence-2026
      S3_BUCKET_NAME: retail-attention-intelligence-bucket
      AWS_REGION: us-east-1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  cv_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: retail_cv_worker
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword2026@postgres:5432/retail_intelligence
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retail_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
