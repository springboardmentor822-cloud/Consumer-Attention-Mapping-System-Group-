version: '3.8'

services:
  # 1. PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: cams_postgres
    restart: always
    environment:
      POSTGRES_DB: cams_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Message Stream Buffer Service
  redis:
    image: redis:7-alpine
    container_name: cams_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Backend REST API & Telemetry Engine Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cams_backend
    restart: always
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/cams_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretcamsjwtkey2026
      - ENVIRONMENT=production
    volumes:
      - ./backend:/app
      - ./datasets:/app/datasets
      - ./archive:/app/archive
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Next.js Frontend Analytics Dashboard Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cams_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
