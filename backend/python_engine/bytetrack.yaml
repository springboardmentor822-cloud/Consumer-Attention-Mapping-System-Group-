# CAMS ByteTrack configuration — strict person-only tracking
tracker_type: bytetrack

# Detection confidence thresholds
track_high_thresh: 0.50    # High-confidence detections for primary matching (raised from 0.35)
track_low_thresh:  0.25    # Lower-confidence matching for occluded re-association (raised from 0.15)
new_track_thresh:  0.60    # Min confidence to birth a brand-new person track (raised from 0.40)
                            # Shelves/objects that YOLO fires at 0.3-0.55 will NOT birth new tracks

# Track buffer: 45 frames (~1.5s at 30fps) — faster ghost-track removal
track_buffer: 45

# Association IoU threshold — tighter for better ID stability across crowds
match_thresh: 0.75

# Score fusion
fuse_score: True
