version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: cams_user
      POSTGRES_PASSWORD: cams_pass
      POSTGRES_DB: cams_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: .
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://cams_user:cams_pass@db:5432/cams_db
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  pgdata:
